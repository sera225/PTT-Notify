name: PTT Monitor (Manual Only)

on:
  # 已改為由 Render 24 小時常駐執行，因此關閉 GitHub 定時排程避免重複推播
  # 若想在 GitHub 手動測試仍可點選按鈕觸發
  workflow_dispatch:

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 簽出代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 執行 PTT 監控檢查
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python ptt_notify.py
