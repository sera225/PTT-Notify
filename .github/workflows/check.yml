name: PTT Monitor

on:
  schedule:
    # 每 5 分鐘執行一次（GitHub 最短允許間隔為 5 分鐘）
    - cron: '*/5 * * * *'
  push:
    branches: [ master, main ]
  workflow_dispatch: # 支援在 GitHub 網頁手動觸發測試

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 賦予寫入權限，用來保存 ptt_seen.json
    steps:
      - name: 簽出代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 執行 PTT 監控檢查
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PTT_TELEGRAM_TOKEN: ${{ secrets.PTT_TELEGRAM_TOKEN }}
          PTT_TELEGRAM_CHAT_ID: ${{ secrets.PTT_TELEGRAM_CHAT_ID }}
        run: |
          python ptt_notify.py --once

      - name: 儲存已讀文章紀錄 (避免重複推播)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ptt_seen.json
          git commit -m "Update seen state [skip ci]" || exit 0
          git push
